<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' http://127.0.0.1:* ws://127.0.0.1:* https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data:;">
  <title>Architect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/layout.css">
</head>
<body>
  <!-- Splash / Welcome Screen -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-content">
      <div class="splash-logo">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#6c8cff"/>
          <path d="M20 44L32 16L44 44" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M24 36H40" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="32" cy="16" r="3" fill="white"/>
          <circle cx="24" cy="36" r="2.5" fill="white"/>
          <circle cx="40" cy="36" r="2.5" fill="white"/>
        </svg>
      </div>
      <h1 class="splash-title">Architect</h1>
      <p class="splash-subtitle">Architecture Visualization IDE</p>
      <div class="splash-actions">
        <button class="splash-btn primary" id="btn-open-folder">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
          Open Folder
        </button>
      </div>
      <div class="splash-status" id="splash-status"></div>
    </div>
  </div>

  <!-- Main IDE Layout -->
  <div id="ide-container" class="ide-container hidden">
    <!-- Title Bar -->
    <div id="titlebar" class="titlebar">
      <div class="titlebar-left">
        <svg width="20" height="20" viewBox="0 0 64 64" fill="none" class="titlebar-icon">
          <rect width="64" height="64" rx="14" fill="#6c8cff"/>
          <path d="M20 44L32 16L44 44" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M24 36H40" stroke="white" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span class="titlebar-title" id="project-name">Architect</span>
      </div>
      <div class="titlebar-center">
        <span class="titlebar-path" id="titlebar-path"></span>
      </div>
      <div class="titlebar-right">
        <button class="titlebar-btn" id="btn-cursor-status" title="Cursor AI Status">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m-7-7H1m22 0h-4m-1.5-7.5l-3 3m-5 5l-3 3m0-11l3 3m5 5l3 3"/></svg>
          <span class="status-dot" id="cursor-dot"></span>
        </button>
      </div>
    </div>

    <!-- Activity Bar -->
    <div id="activity-bar" class="activity-bar">
      <button class="activity-btn active" data-panel="explorer" title="Explorer (Ctrl+B)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      </button>
      <button class="activity-btn" data-panel="graph" title="Architecture Graph (Ctrl+G)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 6h6M6 9v6M18 9v6M9 18h6"/></svg>
      </button>
      <button class="activity-btn" data-panel="chat" title="AI Chat (Ctrl+Shift+C)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      </button>
      <div class="activity-spacer"></div>
      <button class="activity-btn" data-panel="terminal" title="Terminal (Ctrl+`)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      </button>
    </div>

    <!-- Main Content Area -->
    <div id="main-area" class="main-area">
      <!-- Left Sidebar (Explorer) -->
      <div id="sidebar-left" class="sidebar sidebar-left">
        <div class="sidebar-header">
          <span class="sidebar-title">EXPLORER</span>
        </div>
        <div id="file-tree" class="file-tree"></div>
      </div>
      <div id="resize-left" class="resize-handle resize-handle-v"></div>

      <!-- Center Area -->
      <div id="center-area" class="center-area">
        <!-- Editor Tabs -->
        <div id="editor-tabs" class="editor-tabs">
          <div id="tab-list" class="tab-list"></div>
        </div>

        <!-- Editor / Graph Container -->
        <div id="editor-container" class="editor-container">
          <div id="monaco-container" class="monaco-container"></div>
          <div id="graph-container" class="graph-container hidden"></div>
          <div id="welcome-tab" class="welcome-tab">
            <div class="welcome-content">
              <svg width="48" height="48" viewBox="0 0 64 64" fill="none" class="welcome-icon">
                <rect width="64" height="64" rx="14" fill="#6c8cff" opacity="0.15"/>
                <path d="M20 44L32 16L44 44" stroke="#6c8cff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M24 36H40" stroke="#6c8cff" stroke-width="3.5" stroke-linecap="round"/>
              </svg>
              <h2>Welcome to Architect</h2>
              <p>Open a file from the explorer or view the architecture graph.</p>
              <div class="welcome-shortcuts">
                <div class="shortcut"><kbd>Ctrl+B</kbd> Toggle Explorer</div>
                <div class="shortcut"><kbd>Ctrl+G</kbd> Toggle Graph</div>
                <div class="shortcut"><kbd>Ctrl+`</kbd> Toggle Terminal</div>
                <div class="shortcut"><kbd>Ctrl+S</kbd> Save File</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Resize Handle for Bottom Panel -->
        <div id="resize-bottom" class="resize-handle resize-handle-h hidden"></div>

        <!-- Bottom Panel (Terminal) -->
        <div id="panel-bottom" class="panel-bottom hidden">
          <div class="panel-header">
            <span class="panel-title">TERMINAL</span>
            <div class="panel-actions">
              <button class="panel-btn" id="btn-new-terminal" title="New Terminal">+</button>
              <button class="panel-btn" id="btn-close-panel" title="Close Panel">&times;</button>
            </div>
          </div>
          <div id="terminal-tabs" class="terminal-tabs"></div>
          <div id="terminal-container" class="terminal-container"></div>
        </div>
      </div>

      <!-- Right Sidebar (Chat) -->
      <div id="resize-right" class="resize-handle resize-handle-v hidden"></div>
      <div id="sidebar-right" class="sidebar sidebar-right hidden">
        <div class="sidebar-header">
          <span class="sidebar-title">AI CHAT</span>
          <span class="sidebar-badge" id="cursor-badge">Cursor</span>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
          <textarea id="chat-input" class="chat-input" placeholder="Ask Architect AI..." rows="2"></textarea>
          <button class="chat-send" id="btn-send-chat" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="statusbar" class="statusbar">
      <div class="statusbar-left">
        <span class="status-item" id="status-backend">
          <span class="status-dot-sm" id="backend-dot"></span>
          Backend
        </span>
        <span class="status-item" id="status-project"></span>
      </div>
      <div class="statusbar-right">
        <span class="status-item" id="status-cursor-info"></span>
        <span class="status-item" id="status-line-col"></span>
        <span class="status-item" id="status-language"></span>
      </div>
    </div>
  </div>

  <script src="../dist-renderer/app.js" type="module"></script>
</body>
</html>
