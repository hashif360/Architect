[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "architect-tool"
version = "0.1.0"
description = "Application architecture visualization and context graph tool"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "rich>=13.0.0",
    "markdown>=3.5.0",
    "watchfiles>=0.21.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
mysql = ["pymysql>=1.1.0"]
mssql = ["pyodbc>=5.0.0"]
mssql-alt = ["pymssql>=2.2.0"]
azure = ["azure-identity>=1.15.0", "azure-keyvault-secrets>=4.8.0"]
aws = ["boto3>=1.34.0"]
database = [
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "pyodbc>=5.0.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.8.0",
    "boto3>=1.34.0",
]

[project.scripts]
architect = "architect.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/architect"]
